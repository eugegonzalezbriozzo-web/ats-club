# Publicación web de ATS Club en Netlify (igual que ATS).
# Netlify instala las dependencias, exporta la versión web de Expo y publica la carpeta dist.
[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# La app maneja sus propias rutas (/c/sierras-chicas, /torneo/..., etc.):
# cualquier dirección abre la app y ella muestra la pantalla que corresponde.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker de las notificaciones no se guarda en caché: así cada versión nueva se toma enseguida.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
