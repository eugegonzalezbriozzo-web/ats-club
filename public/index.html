<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="La app de tu club de arquería: torneos, inscripciones, noticias, encuestas y pagos." />
    <!-- App instalable (PWA): nombre, íconos y colores -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#032845" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ATS Club" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background: #032845;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Pantalla de carga: se ve hasta que arranca la app (React la reemplaza) */
      .cargando {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #032845;
      }
      .cargando img {
        width: min(56vw, 280px);
        height: auto;
        animation: aparecer 0.6s ease-out both;
      }
      @keyframes aparecer {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cargando img { animation: none; }
      }
    </style>
  </head>

  <body>
    <noscript>
      Para usar ATS Club tenés que activar JavaScript en el navegador.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"><div class="cargando"><img src="/logo-carga.png" alt="ATS Club" /></div></div>
  </body>
</html>
